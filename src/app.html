<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- הפונט נטען כאן ולא ב-@import בתוך ה-CSS: import בתוך גיליון נפתר רק
		     אחרי שהגיליון עצמו ירד (שרשרת חוסמת-רינדור). preconnect פותח את
		     החיבורים מוקדם, ו-display=swap מציג טקסט מיד בפונט המערכת. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap"
		/>
		<!-- המודעות נטענות בצד-הלקוח (adSlots.ts); ה-preload משגר את הבקשה
		     כבר עם ה-HTML — במקביל להורדת ה-JS — כך שכשה-fetch רץ התשובה
		     כבר בדרך/בקאש. crossorigin תואם למצב ברירת-המחדל של fetch. -->
		<link rel="preload" href="/api/ads/approved" as="fetch" crossorigin="anonymous" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
