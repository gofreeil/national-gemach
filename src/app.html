<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- הגופן (Heebo) מתארח אצלנו ומוגדר ב-@font-face שב-app.css — אין כאן
		     עוד link לגוגל: זו הייתה בקשה חוסמת-רינדור לשרת חיצוני. -->
		<!-- המודעות נטענות בצד-הלקוח (adSlots.ts); ה-preload משגר את הבקשה
		     כבר עם ה-HTML — במקביל להורדת ה-JS — כך שכשה-fetch רץ התשובה
		     כבר בדרך/בקאש. crossorigin תואם למצב ברירת-המחדל של fetch. -->
		<link rel="preload" href="/api/ads/approved" as="fetch" crossorigin="anonymous" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
