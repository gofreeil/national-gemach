<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- הגופן (Heebo) מתארח אצלנו ומוגדר ב-@font-face שב-app.css — אין כאן
		     עוד link לגוגל: זו הייתה בקשה חוסמת-רינדור לשרת חיצוני. -->
		<!-- המודעות נטענות בצד-הלקוח (adSlots.ts); ה-preload משגר את הבקשה
		     כבר עם ה-HTML — במקביל להורדת ה-JS — כך שכשה-fetch רץ התשובה
		     כבר בדרך/בקאש. crossorigin תואם למצב ברירת-המחדל של fetch. -->
		<link rel="preload" href="/api/ads/approved" as="fetch" crossorigin="anonymous" />
		<script>
			addEventListener('error', function (e) {
				var t = e.target;
				if (!t || !t.tagName) return;
				var u = t.href || t.src || '';
				if (u.indexOf('/_app/') === -1) return;
				try {
					if (sessionStorage.getItem('asset-reload')) return;
					sessionStorage.setItem('asset-reload', '1');
				} catch (_) { return; }
				location.reload();
			}, true);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- עורך הכיתובים של הרשת (סופר-אדמין): סקריפט אחד משותף מה-API, בלי קוד באתר (community-backend/public/site-editor.js) -->
		<script defer src="https://api.gofreeil.com/site-editor.js" data-site="gemach"></script>
	</body>
</html>
